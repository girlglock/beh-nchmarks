<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>beh nchmarks</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.441.0/font/lucide.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="vanta-bg"></div>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.10.4/umd/Recharts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>
  <script>
    const hasHWA = (() => {
      const canvas2d = document.createElement("canvas");
      const test = (force) => {
        const ctx = canvas2d.getContext("2d", { willReadFrequently: force });
        ctx.moveTo(0, 0);
        ctx.lineTo(120, 121);
        ctx.stroke();
        return ctx.getImageData(0, 0, 200, 200).data.join();
      };
      const pixelsDiffer = test(true) !== test(false);

      const canvasGl = document.createElement("canvas");
      const gl = canvasGl.getContext("webgl") || canvasGl.getContext("experimental-webgl");
      const isSoftwareGL = (() => {
        if (!gl) return false;
        const ext = gl.getExtension("WEBGL_debug_renderer_info");
        if (!ext) return false;
        const renderer = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || "";
        console.log(renderer);
        return /SwiftShader|llvmpipe|Microsoft Basic Render Driver/i.test(renderer);
      })();

      return pixelsDiffer && !isSoftwareGL;
    })();
    if (hasHWA) {
      document.documentElement.classList.add("hwa");
      window.vantaEffect = VANTA.BIRDS({
        el: "#vanta-bg",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.00,
        minWidth: 200.00,
        scale: 1.00,
        scaleMobile: 1.00,
        backgroundColor: 0x10a14,
        color1: 0x11f054,
        color2: 0x11f054,
        quantity: 2.00
      });
    }
  </script>
  <script type="module" src="scripts/main.js"></script>
</body>

</html>
